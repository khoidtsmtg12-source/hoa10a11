<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Nguyên Tử – 100 câu ôn tập</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#e9f0f7;--card:#fff;--ink:#0f2540;--mut:#53657d;--line:#cfdae6;--s1:#0a7ea4;--s2:#d1366f;--s3:#6d4af0;--ok:#12864a;--no:#d6343f;--sh:0 10px 30px #0f254018;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1727;--card:#122238;--ink:#e8f0fb;--mut:#9db0c9;--line:#243a57;--s1:#38c6f0;--s2:#ff7aa8;--s3:#a99bff;--ok:#4ee08e;--no:#ff7076;--sh:0 10px 30px #0007;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1727;--card:#122238;--ink:#e8f0fb;--mut:#9db0c9;--line:#243a57;--s1:#38c6f0;--s2:#ff7aa8;--s3:#a99bff;--ok:#4ee08e;--no:#ff7076;--sh:0 10px 30px #0007;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:16px 16px 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
h1{font-size:clamp(34px,9vw,52px);line-height:1.05;margin:8px 0;font-weight:800;letter-spacing:-.02em}
.hero{display:flex;gap:18px;align-items:center;padding:18px 0 8px}
.hero p{margin:0;color:var(--mut)}
.atom{position:relative;width:84px;height:84px;flex:none}
.atom i{position:absolute;inset:0;border:2.5px solid var(--s1);border-radius:50%;transform:rotate(var(--a)) scaleY(.38);animation:spin 5s linear infinite}
.atom i:nth-child(1){--a:0deg}.atom i:nth-child(2){--a:60deg;border-color:var(--s2);animation-duration:7s}.atom i:nth-child(3){--a:120deg;border-color:var(--s3);animation-duration:9s}
.atom b{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--ink)}
@keyframes spin{to{transform:rotate(calc(var(--a) + 360deg)) scaleY(.38)}}
.lbl{font-size:15px;color:var(--mut);margin:24px 0 8px;font-weight:600}
.secs{display:grid;gap:10px}
.sc{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;opacity:.55;transition:.2s}
.sc.on{opacity:1;border-color:var(--c);box-shadow:var(--sh)}
.sc b{display:block;font-size:17px}.sc small{display:block;color:var(--mut)}.sc em{font-style:normal;font-size:13px;color:var(--c);font-weight:600}
.num{flex:none;width:48px;height:56px;border:2px solid var(--c);border-radius:8px;display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--c)}
.s1{--c:var(--s1)}.s2{--c:var(--s2)}.s3{--c:var(--s3)}
.lvs{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 18px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go,.btns button{background:var(--c,var(--ink));color:#fff;border-radius:14px;padding:14px 22px;font-weight:800;font-size:17px;transition:transform .15s}
.go{width:100%;margin-top:26px;--c:var(--s1)}
.go:disabled{opacity:.4}.go:active,.btns button:active{transform:scale(.97)}
.note{color:var(--mut);font-size:14px;text-align:center}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-weight:600}
.top button{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.bar{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--s1));transition:width .5s;border-radius:9px}
.card{position:relative;background:var(--card);border-radius:20px;border-top:6px solid var(--c);box-shadow:var(--sh);padding:20px;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(24px) rotate(-.6deg)}}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tags span{font-size:13px;font-weight:600;border-radius:8px;padding:3px 10px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tags .lv.a{background:var(--ink);color:var(--bg)}
.q{font-size:18px;margin:6px 0 14px}.q small,.tile small{color:var(--mut)}
.vis{text-align:center;margin:8px 0 16px}
.tile{display:inline-flex;flex-direction:column;align-items:center;border:2.5px solid var(--c);border-radius:12px;padding:10px 20px;margin:4px;background:color-mix(in srgb,var(--c) 7%,transparent)}
.nt{display:inline-flex;align-items:center;font-weight:800;line-height:1}
.nt i{display:flex;flex-direction:column;font-style:normal;font-size:.5em;text-align:right;margin-right:.14em;gap:.12em;font-weight:600;color:var(--c)}
.nt u{text-decoration:none;font-size:.5em;align-self:flex-start;margin-left:.08em}
.tile .nt{font-size:54px}.q .nt,.opt .nt{font-size:1.4em}
input#ans{width:100%;padding:14px;font-size:18px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
input#ans:focus{border-color:var(--c);outline:0}
.opts{display:grid;gap:10px}.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--c)}
.tf .opt{justify-content:center;font-size:18px;padding:16px}
.opt i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none;font-size:14px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent);animation:pop .5s}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,transparent);animation:shake .45s}
.hintbox,.fb{margin-top:14px;border-radius:12px;padding:12px 14px;animation:in .3s}
.hintbox{background:color-mix(in srgb,#f2b705 22%,transparent)}
.fb.good{background:color-mix(in srgb,var(--ok) 16%,transparent)}.fb.bad{background:color-mix(in srgb,var(--no) 14%,transparent)}
.fb p{margin:4px 0 0}.fb b{font-size:18px}
.good b{color:var(--ok)}.bad b{color:var(--no)}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btns .ghost,.ghost{background:var(--bg)!important;color:var(--ink)!important;border:2px solid var(--line)}
.card.pop{animation:pop .5s}.card.shake,input.shake{animation:shake .45s}
@keyframes pop{40%{transform:scale(1.025)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.cf{position:absolute;left:50%;top:40%;pointer-events:none;font-size:20px;animation:fly .9s ease-out forwards;z-index:5}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.res h2{font-size:30px;margin:0}.big{font-size:56px;font-weight:800;line-height:1.1}.big small{font-size:16px;color:var(--mut);font-weight:400}
.sblk{border-left:5px solid var(--c);padding:6px 12px;margin:12px 0}
.sblk h3{margin:0 0 6px;font-size:16px;color:var(--c)}
.br{display:flex;gap:10px;align-items:center;font-size:14px}.br span{width:70px}
sup,sub{line-height:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Dữ liệu & công cụ ===== */
const R=['','I','II','III','IV','V','VI','VII','VIII'];
const EL=[[1,'H','Hiđro',1],[2,'He','Heli',4],[3,'Li','Liti',7],[4,'Be','Beri',9],[5,'B','Bo',11],[6,'C','Cacbon',12],[7,'N','Nitơ',14],[8,'O','Oxi',16],[9,'F','Flo',19],[10,'Ne','Neon',20],[11,'Na','Natri',23],[12,'Mg','Magie',24],[13,'Al','Nhôm',27],[14,'Si','Silic',28],[15,'P','Photpho',31],[16,'S','Lưu huỳnh',32],[17,'Cl','Clo',35],[18,'Ar','Agon',40],[19,'K','Kali',39],[20,'Ca','Canxi',40],[24,'Cr','Crom',52],[26,'Fe','Sắt',56],[29,'Cu','Đồng',63],[30,'Zn','Kẽm',65]].map(([Z,s,n,A])=>({Z,s,n,A}));
const byZ=z=>EL.find(e=>e.Z==z),zOf=s=>EL.find(e=>e.s==s)||{Z:35,s:'Br',n:'Brom',A:80};
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const deck=l=>{let d=[];return()=>{if(!d.length)d=shuf(l);return d.pop()}};
const fm=v=>String(+(+v).toFixed(3)).replace('.',',');
const nt=(A,Z,X,c)=>`<span class="nt"><i><span>${A}</span><span>${Z}</span></i>${X}${c?`<u>${c}</u>`:''}</span>`;
const tile=h=>`<span class="tile">${h}</span>`;
const chg=q=>q?(Math.abs(q)>1?Math.abs(q):'')+(q>0?'+':'−'):'';
const sp=s=>s.replace(/([spd])(\d+)/g,'$1<sup>$2</sup>');
/* cấu hình electron */
const ORD=[[1,0,2],[2,0,2],[2,1,6],[3,0,2],[3,1,6],[4,0,2],[3,2,10],[4,1,6]];
function cfg(Z){let r=Z,o=[];for(const[n,l,c]of ORD){if(r<=0)break;const k=Math.min(c,r);o.push([n,l,k]);r-=k}
 if(Z==24)o=o.map(x=>x[0]==4&&x[1]==0?[4,0,1]:x[0]==3&&x[1]==2?[3,2,5]:x);
 if(Z==29)o=o.map(x=>x[0]==4&&x[1]==0?[4,0,1]:x[0]==3&&x[1]==2?[3,2,10]:x);
 return o}
function ion(Z,q){if(q<0)return cfg(Z-q);const o=cfg(Z).map(x=>[...x]);let k=q;for(const x of[...o].sort((a,b)=>b[0]-a[0]||b[1]-a[1])){const t=Math.min(k,x[2]);x[2]-=t;k-=t}return o.filter(x=>x[2]>0)}
const fmt=(o,sh)=>(sh?[...o].sort((a,b)=>a[0]-b[0]||a[1]-b[1]):o).map(([n,l,c])=>n+'spd'[l]+c).join(' ');
const per=Z=>Math.max(...cfg(Z).map(x=>x[0]));
const grp=Z=>Z==2?'VIIIA':({24:'VIB',26:'VIIIB',29:'IB',30:'IIB'})[Z]||R[cfg(Z).filter(x=>x[0]==per(Z)).reduce((a,x)=>a+x[2],0)]+'A';
const out=Z=>Z==2?2:R.indexOf(grp(Z).replace('A',''));
const kind=Z=>[2,10,18].includes(Z)?'Khí hiếm':[1,5,6,7,8,9,14,15,16,17].includes(Z)?'Phi kim':'Kim loại';
const unp=Z=>cfg(Z).reduce((a,[n,l,c])=>{const cap=2*(2*l+1),h=cap/2;return a+(c<=h?c:cap-c)},0);
const pe=Z=>cfg(Z).filter(x=>x[1]==1).reduce((a,x)=>a+x[2],0);
/* kiểm tra đáp án */
const num=(v,t=.011)=>{const f=s=>Math.abs(parseFloat(String(s).replace(',','.').replace(/[^\d.\-]/g,''))-v)<=t;f.n=1;return f};
const sn=s=>s.toLowerCase().replace(/nhóm|\s|[.\-]/g,'');
const str=(...v)=>s=>v.map(sn).includes(sn(s));
const nc=s=>s.toLowerCase().replace(/[\s^\[\]{}_]/g,'').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c));
const cf=o=>s=>[nc(fmt(o)),nc(fmt(o,1))].includes(nc(s));
const wr=(r,c)=>[...new Set(c.map(String))].filter(x=>x!=String(r)&&!(+x<0)).slice(0,3);
const mc=(q,r,c,hint,exp)=>{const o=shuf([String(r),...wr(r,c)]);return{type:'mcq',q,opts:o,ci:o.indexOf(String(r)),hint,exp}};
const tf=(q,tr,hint,exp)=>({type:'tf',q,tr,ans:tr?'Đúng':'Sai',hint,exp});
const mk=(g,n)=>Array.from({length:n},(_,i)=>g[i%g.length]());

/* ===== PHẦN 1: kí hiệu nguyên tử ===== */
const nx=deck(EL),nxa=deck(EL.filter(e=>e.Z>2));
const IONS=[[26,3],[26,2],[29,2],[30,2],[13,3],[12,2],[20,2],[16,-2],[17,-1],[15,-3],[8,-2],[7,-3]],nxi=deck(IONS);
const inf=e=>`P = E = Z = ${e.Z}; N = A − Z = ${e.A} − ${e.Z} = ${e.A-e.Z}.`;
const TFS=deck([
 [`${nt(12,6,'C')} và ${nt(14,6,'C')} là hai đồng vị của nhau.`,1,'Đồng vị: cùng Z, khác N (khác số khối).','Cùng Z = 6, khác số khối nên là đồng vị.'],
 [`${nt(40,18,'Ar')} và ${nt(40,20,'Ca')} là hai đồng vị của nhau.`,0,'Đồng vị phải cùng số proton.','Z khác nhau (18 và 20) nên không phải đồng vị (chỉ trùng số khối).'],
 [`Ion Fe<sup>3+</sup> (Z = 26) có 23 electron.`,1,'Fe mất 3 electron.','26 − 3 = 23 electron.'],
 [`Nguyên tử ${nt(1,1,'H')} không có neutron.`,1,'N = A − Z.','N = 1 − 1 = 0.'],
 [`Ion Cl<sup>−</sup> có số proton nhiều hơn số electron 1 hạt.`,0,'Anion nhận thêm electron.','Cl⁻ nhận 1 e nên electron nhiều hơn proton 1 hạt.'],
 [`Số khối của nguyên tử chính là khối lượng tuyệt đối của nó tính bằng gam.`,0,'Số khối là một số nguyên, không có đơn vị.','A = p + n chỉ là số nguyên.']]);
const S1b=[
()=>{const e=nx(),w=pick(['P','N','E']),L={P:'số proton',N:'số neutron',E:'số electron'},v=w=='N'?e.A-e.Z:e.Z;return{type:'sym',q:`Quan sát kí hiệu nguyên tử và cho biết ${L[w]}.`,vis:tile(nt(e.A,e.Z,e.s)),ok:num(v,0),ans:v,hint:'Số ở dưới là Z (số hiệu) = số p = số e; số ở trên là A (số khối). N = A − Z.',exp:inf(e)}},
()=>{const e=nx();return{type:'text',q:`Nguyên tử ${e.n} có số hiệu Z = ${e.Z} và số khối A = ${e.A}. Tính số neutron.`,ok:num(e.A-e.Z,0),ans:e.A-e.Z,hint:'A = Z + N, suy ra N = A − Z.',exp:inf(e)}},
()=>{const e=nx();return mc(`Nguyên tử ${nt(e.A,e.Z,e.s)} có bao nhiêu electron?`,e.Z,[e.A,e.A-e.Z,e.Z+1,e.Z+2,e.Z+3],'Nguyên tử trung hoà: số e = số p = Z.',inf(e))},
()=>{const e=nx(),N=e.A-e.Z,t=Math.random()<.5,s=t?N:N+pick([1,2,3]);return tf(`Nguyên tử ${nt(e.A,e.Z,e.s)} có ${s} neutron.`,t,'N = A − Z.',inf(e))},
()=>{const e=nx();return{type:'text',q:`Một nguyên tử có ${e.Z} proton, ${e.A-e.Z} neutron và ${e.Z} electron. Tính số khối A.`,ok:num(e.A,0),ans:e.A,hint:'A = số p + số n (electron không tính vì khối lượng rất nhỏ).',exp:`A = ${e.Z} + ${e.A-e.Z} = ${e.A}.`}},
()=>{const e=nx(),N=e.A-e.Z;return mc(`Nguyên tử có ${e.Z} p, ${N} n và ${e.Z} e có kí hiệu đúng là:`,nt(e.A,e.Z,e.s),[nt(e.Z,e.A,e.s),nt(N,e.Z,e.s),nt(e.A+1,e.Z,e.s),nt(e.A,e.Z+1,e.s),nt(e.A-1,e.Z,e.s)],'Viết A ở trên (A = p + n), Z ở dưới (Z = p).',inf(e))}];
const S1a=[
()=>{const e=nxa(),N=e.A-e.Z,S=2*e.Z+N,D=2*e.Z-N,w=pick(['Z','A']),v=w=='Z'?e.Z:e.A;return{type:'think',q:`Nguyên tử X có tổng số hạt (p, n, e) là ${S}, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là ${D}. Tính ${w=='Z'?'số hiệu nguyên tử Z':'số khối A'} của X.`,ok:num(v,0),ans:v,hint:'Hạt mang điện là p và e (tổng 2Z), hạt không mang điện là n. S = 2Z + N, D = 2Z − N. Cộng hai vế: S + D = 4Z.',exp:`S + D = ${S+D} = 4Z ⇒ Z = ${e.Z}; S − D = ${S-D} = 2N ⇒ N = ${N}; A = ${e.A}. X là ${e.n}.`}},
()=>{const[Z,q]=nxi(),e=byZ(Z),T=2*Z-q;return{type:'think',q:`Ion X<sup>${chg(q)}</sup> có tổng số hạt mang điện (p và e) là ${T}. Tính số proton của X.`,ok:num(Z,0),ans:Z,hint:'p = Z, còn e = Z − q (q mang dấu của điện tích). Vậy T = Z + (Z − q).',exp:`T = 2Z − q ⇒ Z = (T + q)/2 = (${T} ${q<0?'−':'+'} ${Math.abs(q)})/2 = ${Z}. X là ${e.n}.`}},
()=>{const[Z,q]=nxi(),e=byZ(Z),N=e.A-Z,E=Z-q,r=Z+N+E;return mc(`Ion ${nt(e.A,Z,e.s,chg(q))} có tổng số hạt p, n, e là:`,r,[2*Z+N,r+1,r-1,r+2,r-2],'p = Z; n = A − Z; e = Z − q (cation mất e, anion nhận e).',`p = ${Z}, n = ${N}, e = ${E} ⇒ tổng ${r}.`)},
()=>{const e=nxa(),N=e.A-e.Z,S=2*e.Z+N;return{type:'think',q:`Nguyên tử X có tổng số hạt p, n, e là ${S} và số khối A = ${e.A}. Tính số neutron của X.`,ok:num(N,0),ans:N,hint:'S = 2Z + N và A = Z + N. Lấy S − A sẽ ra Z.',exp:`S − A = Z = ${e.Z}; N = A − Z = ${N}. X là ${e.n}.`}},
()=>{const[Z,q]=nxi(),e=byZ(Z),E=Z-q,w=pick(['e','t']),v=w=='e'?E:Z+E;return{type:'sym',q:`Quan sát kí hiệu ion và cho biết ${w=='e'?'số electron':'tổng số hạt mang điện (p + e)'} của ion.`,vis:tile(nt(e.A,Z,e.s,chg(q))),ok:num(v,0),ans:v,hint:'Điện tích ghi ở góc trên bên phải: ion dương mất e, ion âm nhận thêm e.',exp:`p = ${Z}; e = ${Z} ${q>0?'−':'+'} ${Math.abs(q)} = ${E}.`}},
()=>{const[s,t,h,x]=TFS();return tf(s,!!t,h,x)}];
const S1=[S1b,S1a];

/* ===== PHẦN 2: nguyên tử khối trung bình ===== */
const ISO={Cl:[[35,75],[37,25]],Cu:[[63,73],[65,27]],Br:[[79,50],[81,50]],B:[[10,20],[11,80]],Li:[[6,7.5],[7,92.5]],Mg:[[24,79],[25,10],[26,11]],Ne:[[20,90.5],[21,.3],[22,9.2]]};
const av=s=>ISO[s].reduce((a,[m,p])=>a+m*p/100,0),avF=s=>fm(Math.round(av(s)*100)/100);
const isoNt=s=>ISO[s].map(([m,p])=>`${nt(m,zOf(s).Z,s)} <small>(${fm(p)}%)</small>`).join('; ');
const calc=s=>`Mtb = (${ISO[s].map(([m,p])=>m+'×'+fm(p)).join(' + ')})/100 = ${avF(s)}.`;
const two=deck(['Cl','Cu','Br','B','Li']),thr=deck(['Mg','Ne']);
const NT=s=>zOf(s).n;
const S2b=[
()=>{const s=two();return{type:'text',q:`Nguyên tố ${NT(s)} có các đồng vị: ${isoNt(s)}. Tính nguyên tử khối trung bình (làm tròn 2 chữ số thập phân).`,ok:num(av(s)),ans:avF(s),hint:'Mtb = (m₁·%₁ + m₂·%₂)/100. Nhớ chia cho 100 khi dùng phần trăm.',exp:calc(s)}},
()=>{const s=two(),r=avF(s),v=av(s),I=ISO[s];return mc(`Nguyên tố ${NT(s)} có các đồng vị: ${isoNt(s)}. Nguyên tử khối trung bình là:`,r,[fm((I[0][0]+I[1][0])/2),fm(I[0][0]*I[1][1]/100+I[1][0]*I[0][1]/100),fm(v+.5),fm(v-.5),fm(v+1)],'Đây là trung bình có trọng số (theo phần trăm), không phải trung bình cộng.',calc(s))},

 <h2 class="lbl">Chọn phần</h2><div class="secs">${['s1','s2','s3'].map(s=>`<button class="sc ${s}" data-s="${s}"><span class="num">${s[1]}</span><span><b>${SEC[s][1]}</b><small>${SEC[s][2]}</small><em>${cnt(s,'b')} câu cơ bản, ${cnt(s,'a')} câu nâng cao</em></span></button>`).join('')}</div>
 <h2 class="lbl">Chọn mức độ</h2><div class="lvs">${[['all','Tất cả'],['b','Cơ bản'],['a','Nâng cao (siêu khó)']].map(([k,t])=>`<button class="chip" data-lv="${k}">${t}</button>`).join('')}</div>
 <button class="go" id="go"></button><p class="note">Câu hỏi được xáo trộn mỗi lần chơi. Dùng gợi ý sẽ chỉ được nửa điểm.</p>`;upd()}
function upd(){const n=poolOf().length,g=$('#go');g.disabled=!n;g.textContent=n?`Bắt đầu · ${n} câu`:'Hãy chọn ít nhất 1 phần';document.querySelectorAll('.sc').forEach(b=>b.classList.toggle('on',!!sel[b.dataset.s]));document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.lv==lv))}
function start(l){pool=shuf(l||poolOf());i=0;score=0;streak=0;best=0;wrong=[];log=[];show()}
function show(){
 const q=pool[i];hint=false;done=false;
 let body;
 if(q.type=='mcq')body=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><i>${'ABCD'[k]}</i><span>${o}</span></button>`).join('')}</div>`;
 else if(q.type=='tf')body=`<div class="opts tf"><button class="opt" data-k="1">✔ Đúng</button><button class="opt" data-k="0">✘ Sai</button></div>`;
 else body=`<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${q.ok.n?'inputmode="decimal"':''} placeholder="Nhập đáp án…">`;
 const choice=q.type=='mcq'||q.type=='tf';
 app.innerHTML=`<div class="top ${q.sec}"><button data-a="home" aria-label="Về trang chủ">←</button><div class="bar"><i style="width:${i/pool.length*100}%"></i></div><span>${i+1}/${pool.length}</span><span id="sc">★ ${score}</span><span id="st">🔥 ${streak}</span><button data-a="mute" aria-label="Bật tắt âm thanh">${mute?'🔇':'🔊'}</button></div>
 <article class="card ${q.sec}" id="card"><div class="tags"><span>${SEC[q.sec][0]}: ${SEC[q.sec][1]}</span><span class="lv ${q.lv}">${q.lv=='a'?'Nâng cao ⚡':'Cơ bản'}</span><span>${TY[q.type]}</span></div>
 <p class="q">${q.q}</p>${q.vis?`<div class="vis">${q.vis}</div>`:''}${body}<div id="hb"></div><div id="fb"></div>
 <div class="btns"><button class="ghost" data-a="hint">💡 Gợi ý</button><button id="main" data-a="main" ${choice?'hidden':''}>Kiểm tra</button></div></article>`;
 const a=$('#ans');if(a)a.focus({preventScroll:true})}
function submit(v){
 if(done)return;const q=pool[i];let ok;
 if(q.type=='mcq')ok=v==q.ci;else if(q.type=='tf')ok=(v==1)==q.tr;
 else{if(!String(v).trim()){$('#ans').classList.add('shake');setTimeout(()=>$('#ans').classList.remove('shake'),450);return}ok=q.ok(v)}
 done=true;const pts=ok?(hint?5:10):0;score+=pts;streak=ok?streak+1:0;best=Math.max(best,streak);log.push({sec:q.sec,lv:q.lv,ok});if(!ok)wrong.push(q);
 const ans=q.type=='mcq'?`${'ABCD'[q.ci]}. ${q.opts[q.ci]}`:q.ans;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const k=b.dataset.k;if(q.type=='mcq'?k==q.ci:(k==1)==q.tr)b.classList.add('ok');else if(k==v)b.classList.add('no')});
 $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Chính xác! +'+pts+' điểm':'Chưa đúng'}</b>${ok?'':`<p>Đáp án: <b>${ans}</b></p>`}<p>${q.exp}</p></div>`;
 const c=$('#card');c.classList.add(ok?'pop':'shake');if(ok){burst(c);sOK()}else sNO();
 $('#sc').textContent='★ '+score;$('#st').textContent='🔥 '+streak;
 const m=$('#main');m.hidden=false;m.textContent=i+1<pool.length?'Câu tiếp':'Xem kết quả';m.dataset.a='next';
 const ai=$('#ans');if(ai)ai.disabled=true;m.focus({preventScroll:true})}
function fin(){sWIN();const tot=pool.length,ok=log.filter(x=>x.ok).length,pc=Math.round(ok/tot*100);
 const row=(l,f)=>{const a=log.filter(f);if(!a.length)return'';const c=a.filter(x=>x.ok).length;return`<div class="br"><span>${l}</span><div class="bar"><i style="width:${c/a.length*100}%"></i></div><b>${c}/${a.length}</b></div>`};
 app.innerHTML=`<div class="card res s1" id="card"><h2>${pc>=90?'🏆 Xuất sắc!':pc>=70?'🎉 Khá tốt!':pc>=50?'💪 Cố lên!':'📚 Ôn thêm nhé!'}</h2><div class="big">${score}<small> / ${tot*10} điểm</small></div><p>Đúng ${ok}/${tot} câu (${pc}%). Chuỗi đúng dài nhất: ${best}.</p>
 ${['s1','s2','s3'].map(s=>{const h=row('Cơ bản',x=>x.sec==s&&x.lv=='b')+row('Nâng cao',x=>x.sec==s&&x.lv=='a');return h?`<div class="sblk ${s}"><h3>${SEC[s][0]}: ${SEC[s][1]}</h3>${h}</div>`:''}).join('')}
 <div class="btns">${wrong.length?`<button data-a="redo">Ôn ${wrong.length} câu sai</button>`:''}<button class="ghost" data-a="again">Chơi lại, xáo trộn</button><button class="ghost" data-a="home">Trang chủ</button></div></div>`;
 setTimeout(()=>burst($('#card')),200)}
app.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;sTap();
 if(d.s){sel[d.s]=!sel[d.s];upd()}
 else if(d.lv){lv=d.lv;upd()}
 else if(b.id=='go')start();
 else if(d.k!==undefined)submit(d.k);
 else if(d.a=='main')submit($('#ans').value);
 else if(d.a=='next'){i++;i<pool.length?show():fin()}
 else if(d.a=='hint'){if(done)return;hint=true;$('#hb').innerHTML=`<div class="hintbox">💡 ${pool[i].hint}</div>`}
 else if(d.a=='home')home();
 else if(d.a=='mute'){mute=!mute;b.textContent=mute?'🔇':'🔊'}
 else if(d.a=='again')start(poolOf().length?undefined:Q);
 else if(d.a=='redo')start(wrong)};
document.addEventListener('keydown',e=>{if(e.key=='Enter'){const m=$('#main');if(m&&!m.hidden&&document.activeElement.tagName!='BUTTON'||document.activeElement.id=='ans')m&&m.click()}});
home();
</script>
</body>
</html>
